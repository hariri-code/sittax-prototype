<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: white;
        }

        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .container {
            width: 60%;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .left-side {
            flex: 1;
        }

        input::placeholder{
            color: rgb(232, 81, 151);
        }

        a{
            color: purple;
            text-decoration: none;
        }

        #registerForm {
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 15px;
            border-radius: 20px;
        }

        input {
            border-radius: 3px;
        }

        button {
            border-radius: 3px;
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="left-side">
        <h1>muttax</h1>
        </div>

        <div class="right-side">
            <form id="registerForm">

            <input type="text" id="name" placeholder="Fullname" required>
            <input type="text" id="email" placeholder="Email" required>
            <input type="text" id="password" placeholder="Password" required>
            <button type="submit"><a href="login.html">Register</a></button>
            <h3>Already have an account?<a href="login.html">Login</a></h3>

            </form>
        </div>

    </div>
    
</body>
</html>
